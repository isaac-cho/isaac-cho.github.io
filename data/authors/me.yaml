bio: |
  Isaac Cho is an Associate Professor in the Computer Science department at Hallym University. His research focuses on data visualization, visual analytics, immersive analytics, virtual reality, extended reality, augmented reality, and 3D user interfaces. His work explores how people interact with, perceive, and make decisions using visual and immersive systems. Prior to join Hallym University, he was an assistant professor in the computer science department at Utah State Unviersity and North Carolina A&T State Unviersity.
  
