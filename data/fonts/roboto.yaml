# HugoBlox Font Pack

hugoblox:
  meta:
    format: "hugoblox-font@1"
    name: "Roboto"
    vendor: "custom"
    version: "1.0.0"
    license: "Apache-2.0"
    style: "sans-serif"
    description: "Clean modern typography for an academic website"

  families:
    heading: "Roboto"
    body: "Roboto"
    code: "Roboto Mono"

  weights:
    heading: [400, 500, 600]
    body: [400, 500]
    code: [400]

  leading:
    heading: 1.15
    body: 1.55
    code: 1.5

  tracking:
    heading: "-0.015em"
    body: "-0.005em"

  variable:
    heading: true
    body: true
    code: true